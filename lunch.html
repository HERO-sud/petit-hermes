function parseHours(h){
  h = h || '';
  const WD = '月火水木金土日';
  const needReserve = /要予約|予約制|完全予約/.test(h);
  const fullReserve = /完全予約/.test(h);
  const winter = /冬期|冬季/.test(h);
  const irregular = /不定休/.test(h);
  const starts = [...h.matchAll(/(\d{1,2}):\d{2}\s*[〜~～]/g)].map(m=>parseInt(m[1],10));
  const lunchOK = starts.length ? starts.some(x=>x<15) : true;
  const openOnly = [];
  const pushUniq = (set,c)=>{ if((WD+'祝').includes(c) && !set.includes(c)) set.push(c); };
  let mm;
  if((mm=h.match(/([月火水木金土日祝曜・]+)のみ/))) for(const c of mm[1]) pushUniq(openOnly,c);
  if((mm=h.match(/主に([月火水木金土日祝曜・]+)/))) for(const c of mm[1]) pushUniq(openOnly,c);
  if((mm=h.match(/^([月火水木金土日祝曜・]{2,})\s*\d{1,2}:/))) for(const c of mm[1]) pushUniq(openOnly,c);
  const closed = [];
  if(/平日休/.test(h)){ for(const c of '月火水木金') pushUniq(closed,c); }
  else {
    const noNth = h.replace(/第[0-9０-９]+(?:第[0-9０-９]+)*[週]?[月火水木金土日]/g,'·');
    const cm = noNth.match(/([月火水木金土日祝曜・\/]*[月火水木金土日祝])休/);
    if(cm) for(const c of cm[1]) pushUniq(closed,c);
  }
  let dayLabel='', dayLabelEn='';
  if(openOnly.length){ dayLabel = openOnly.join('・')+'のみ'; dayLabelEn = openOnly.map(c=>WD_EN[c]).join('·')+' only'; }
  else if(closed.length){ dayLabel = closed.join('・')+'休'; dayLabelEn = 'Closed '+closed.map(c=>WD_EN[c]).join('·'); }
  else if(irregular){ dayLabel='不定休'; dayLabelEn='Irregular'; }
  return { lunchOK, openOnly, closed, needReserve, fullReserve, winter, irregular, dayLabel, dayLabelEn };
}
function badgeStyle(k){
  const base='display:inline-flex;align-items:baseline;gap:4px;font-size:11px;border-radius:999px;padding:3px 10px;';
  if(k==='lunch') return base+'color:#cdb36a;background:rgba(201,164,78,.1);border:1px solid rgba(201,164,78,.28);';
  if(k==='warn') return base+'color:#f0b3a6;background:rgba(210,80,59,.16);border:1px solid rgba(210,80,59,.42);';
  if(k==='winter') return base+'color:#9aa3b6;background:rgba(255,255,255,.03);border:1px solid rgba(201,164,78,.16);';
  return base+'color:#c4ccd9;background:rgba(255,255,255,.04);border:1px solid rgba(201,164,78,.22);';
}
function buildBadges(p){
  const out=[];
  if(p.lunchOK) out.push({t:'ランチ営業',e:'Lunch',style:badgeStyle('lunch')});
  if(p.dayLabel) out.push({t:p.dayLabel,e:p.dayLabelEn,style:badgeStyle(p.openOnly.length?'warn':'day')});
  if(p.needReserve) out.push({t:p.fullReserve?'完全予約制':'要予約',e:p.fullReserve?'By appt':'Booking',style:badgeStyle('warn')});
  if(p.winter) out.push({t:'冬期休あり',e:'Winter break',style:badgeStyle('winter')});
  return out;
}
function buildLinks(s){
  const out=[];
  if(s.site) out.push({label:'公式サイト',url:s.site});
  if(s.map) out.push({label:'地図 Map',url:s.map});
  if(s.instagram) out.push({label:'Instagram',url:s.instagram});
  if(s.src && s.src.url){ const l=(s.src.label||'出典').replace('（出典）',''); out.push({label:l,url:s.src.url}); }
  return out;
}

}
function pill(active,accent,textOn){

}

/* ===== 状態 ===== */
const state = { q:'', area:'all', genre:'all', recOnly:false, lunchOnly:false, skipLimited:false, dayFilter:null, sortMode:'area', filterOpen:false };

function compute(){
  const order = AREA_ORDER;
  const st = state;
  const all = SHOPS.slice().sort((a,b)=>(order.indexOf(a.area)-order.indexOf(b.area))||(a.no-b.no));
  const areaCount={}, genreCount={};
  all.forEach(s=>{ areaCount[s.area]=(areaCount[s.area]||0)+1; genreCount[s.genre]=(genreCount[s.genre]||0)+1; });
  const parsed = all.map(s=>({s,p:parseHours(s.hours)}));
  const q=(st.q||'').trim().toLowerCase();
  const hasQuery=q.length>0;
  const day=st.dayFilter;
  const hasActive = hasQuery || st.area!=='all' || st.genre!=='all' || st.recOnly || st.lunchOnly || st.skipLimited || !!day;
  const activeCount = (hasQuery?1:0)+(st.area!=='all'?1:0)+(st.genre!=='all'?1:0)+(st.recOnly?1:0)+(st.lunchOnly?1:0)+(st.skipLimited?1:0)+(day?1:0);
  let fp = parsed.filter(({s,p})=>{
    if(st.area!=='all' && s.area!==st.area) return false;
    if(st.genre!=='all' && s.genre!==st.genre) return false;
    if(st.recOnly && !s.recommended) return false;
    if(st.lunchOnly && !p.lunchOK) return false;
    if(st.skipLimited && (p.needReserve||p.openOnly.length)) return false;
    if(day){ if(p.closed.includes(day)) return false; if(p.openOnly.length && !p.openOnly.includes(day)) return false; }
    if(hasQuery){
      const hay=[s.name,s.reading,s.catch,s.catch_en,s.genre,GENRE_EN[s.genre],s.area,(META[s.area]||{}).romaji,s.point,s.address].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const grouped = st.sortMode==='area';
  if(!grouped) fp = fp.slice().sort((a,b)=>((a.s.recommended?0:1)-(b.s.recommended?0:1))||(order.indexOf(a.s.area)-order.indexOf(b.s.area))||(a.s.no-b.s.no));
  const fAreaCount={}; fp.forEach(({s})=>{ fAreaCount[s.area]=(fAreaCount[s.area]||0)+1; });
  let lastArea=null;
  const items = fp.map(({s,p})=>{
    const m = META[s.area]||{romaji:'',color:'#c9a44e',mood:'',moodEn:''};
    const isStart = grouped && s.area!==lastArea; lastArea=s.area;
    const anchor='area-'+(m.romaji||s.area).toLowerCase();
    return {
      numLabel:String(s.no).padStart(2,'0'), name:s.name, reading:s.reading||'', genre:s.genre, genreEn:GENRE_EN[s.genre]||'',
      area:s.area, areaColor:m.color, recommended:!!s.recommended,
      catch:s.catch, catchEn:s.catch_en||'', point:s.point||'', hasPoint:!!(s.point&&s.point.length),
      hours:s.hours, address:s.address, badges:buildBadges(p),
      photoLink:s.instagram||s.site||s.map||'#', links:buildLinks(s),
      chapterStart:isStart, chapter:{label:s.area,romaji:m.romaji,color:m.color,count:fAreaCount[s.area],mood:m.mood,moodEn:m.moodEn,anchor},
      shopAnchor:'shop-'+s.id,
    };
  });
  const todayJP=['日','月','火','水','木','金','土'][new Date().getDay()];
  const areaChips=[{label:'すべて',en:'All',value:'all',count:all.length,accent:'#c9a44e',textOn:'#1a2230'}]
    .concat(order.filter(a=>areaCount[a]).map(a=>({label:a,en:META[a].romaji,value:a,count:areaCount[a],accent:META[a].color,textOn:META[a].textOn})))
    .map(c=>({label:c.label,en:c.en,count:c.count,value:c.value,style:chipStyle(st.area===c.value,c.accent,c.textOn)}));
  const genreChips=[{label:'すべて',en:'All',value:'all',count:all.length}]
    .concat(GENRE_ORDER.filter(g=>genreCount[g]).map(g=>({label:g,en:GENRE_EN[g],value:g,count:genreCount[g]})))
    .map(c=>({label:c.label,en:c.en,count:c.count,value:c.value,style:chipStyle(st.genre===c.value,'#c9a44e','#1a2230')}));
  const days=['月','火','水','木','金','土','日'];
  const dayChips=days.map(d=>({label:d,value:d,style:pill(st.dayFilter===d,'#c9a44e','#1a2230')}));
  return {
    items, count:all.length, resultCount:fp.length, q:st.q, hasQuery, hasActive, activeCount,
    filterOpen:st.filterOpen, caret:st.filterOpen?'▲':'▼', showIntro:!hasActive, emptyState:fp.length===0,
    areaChips, genreChips, dayChips, todayJP, areaCount,
    filterBtnBg: st.filterOpen?'rgba(201,164,78,.16)':'rgba(255,255,255,.05)',
    todayStyle: pill(!!st.dayFilter && st.dayFilter===todayJP,'#d2503b','#fff'),
    lunchBtnStyle: pill(st.lunchOnly,'#c9a44e','#1a2230'),
    skipBtnStyle: pill(st.skipLimited,'#c9a44e','#1a2230'),
    recBtnStyle: pill(st.recOnly,'#d2503b','#fff'),
    sortAreaStyle: pill(st.sortMode==='area','#c9a44e','#1a2230'),
    sortPickStyle: pill(st.sortMode==='pick','#c9a44e','#1a2230'),
  };
}

      </div>

      <div style="height:2px;margin-top:11px;background:linear-gradient(90deg,${shop.chapter.color},rgba(201,164,78,0));"></div>

  const badges = shop.badges.map(b=>`<span style="${b.style}">${esc(b.t)} <span style="font-family:'Lora',serif;font-style:italic;font-size:9.5px;opacity:.8;">${esc(b.e)}</span></span>`).join('');
  const links = shop.links.map(l=>`<a class="lnk" href="${l.url}" target="_blank" rel="noopener" style="text-decoration:none;font-size:12px;color:#d7cdb6;border:1px solid rgba(201,164,78,.3);border-radius:8px;padding:6px 12px;background:rgba(201,164,78,.05);white-space:nowrap;">${esc(l.label)} →</a>`).join('');
  const pointHtml = shop.hasPoint ? `<p style="font-size:13px;line-height:1.95;color:#9aa3b6;margin:0 0 16px;text-wrap:pretty;">${esc(shop.point)}</p>` : '';
  const recBadge = shop.recommended ? `<span style="font-size:11px;color:#fff;background:#d2503b;border-radius:999px;padding:3px 11px;">★ いちおし</span>` : '';
  return chapter + `
    <div id="${shop.shopAnchor}" style="scroll-margin-top:132px;background:#212a3e;border:1px solid rgba(201,164,78,.14);border-left:3px solid ${shop.areaColor};border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:0 14px 30px -22px rgba(0,0,0,.8);">

        <span style="position:absolute;top:10px;right:12px;width:9px;height:9px;border-radius:50%;background:${shop.areaColor};"></span>
        <span style="font-family:'Shippori Mincho B1',serif;font-size:15px;color:#d7cdb6;">写真をみる　→</span>

        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;">${badges}</div>
        <div style="font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:22px;line-height:1.4;color:#f3ecda;margin:13px 0 1px;text-wrap:pretty;">${esc(shop.name)}</div>

        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;">${links}</div>

    </div>`;
}

function view(){

  const introCards = AREA_ORDER.map(a=>{

  return `

        <div style="font-family:'Shippori Mincho B1',serif;font-size:13px;color:#9aa0b3;letter-spacing:.3em;margin-top:6px;">広 島 県 ・ 北 広 島 町</div>
        <h1 style="font-family:'Yuji Syuku',serif;font-weight:400;font-size:clamp(44px,13vw,60px);line-height:1.14;margin:10px 0 0;color:#f3ecda;letter-spacing:.05em;">味めぐり絵巻</h1>
        <div style="font-family:'Lora',serif;font-style:italic;font-size:12px;letter-spacing:.1em;color:#b6924e;margin-top:9px;">A Picture-Scroll of Flavors · Kitahiroshima</div>
        <p style="font-family:'Shippori Mincho B1',serif;font-size:14px;line-height:1.85;color:#c2c8d6;margin:16px 0 0;text-wrap:balance;">千代田・豊平・芸北・大朝、四つの里の<br>たべあるき四十軒。下で探せます。</p>
        <p style="font-family:'Lora',serif;font-style:italic;font-size:11.5px;line-height:1.6;color:#8b93a6;margin:6px 0 0;">Search 40 lunch spots across four districts.</p>
        <svg viewBox="0 0 480 100" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:100%;height:90px;display:block;">
          <path d="M0 100 L70 50 L140 76 L215 38 L290 72 L360 42 L440 74 L480 56 L480 100 Z" fill="#1b2433"></path>
          <path d="M0 100 L90 70 L165 84 L250 58 L325 86 L405 66 L480 82 L480 100 Z" fill="#141b28"></path>
        </svg>
      </div>

      <div style="margin:0 18px;padding:12px 15px;background:rgba(210,80,59,.08);border:1px solid rgba(210,80,59,.28);border-radius:10px;display:flex;gap:9px;align-items:flex-start;">

/* ===== レンダリング＋操作 ===== */
const app = document.getElementById('app');
function render(){
  const ae = document.activeElement;
  const wasSearch = ae && ae.id === 'q';
  const sel = wasSearch ? ae.selectionStart : null;
  app.innerHTML = view();
  if(wasSearch){ const el=document.getElementById('q'); if(el){ el.focus(); try{ el.setSelectionRange(sel,sel); }catch(e){} } }
}
const ACT = {
  clearQuery: ()=>{ state.q=''; },
  toggleFilter: ()=>{ state.filterOpen=!state.filterOpen; },
  area: v=>{ state.area=v; },
  genre: v=>{ state.genre=v; },
  rec: ()=>{ state.recOnly=!state.recOnly; },
  lunch: ()=>{ state.lunchOnly=!state.lunchOnly; },
  skip: ()=>{ state.skipLimited=!state.skipLimited; },
  day: v=>{ state.dayFilter = state.dayFilter===v ? null : v; },
  today: ()=>{ const t=['日','月','火','水','木','金','土'][new Date().getDay()]; state.dayFilter = state.dayFilter===t ? null : t; },
  sortArea: ()=>{ state.sortMode='area'; },
  sortPick: ()=>{ state.sortMode='pick'; },
  reset: ()=>{ Object.assign(state,{q:'',area:'all',genre:'all',recOnly:false,lunchOnly:false,skipLimited:false,dayFilter:null}); },
};
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const fn = ACT[b.dataset.act];
  if(fn){ fn(b.dataset.val); render(); }
});
app.addEventListener('input', e=>{
  if(e.target.id==='q'){ state.q=e.target.value; render(); }
});
render();
</script>
