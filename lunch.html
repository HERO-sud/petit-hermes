/* ===== Instagram公式埋め込み（鍵不要・正規・遅延読み込み） =====
   他者写真の直リンク/転載はせず、公式の埋め込み機能で“本物・最新”の写真を表示。
   IntersectionObserverで見えたカードだけ読み込むため初期表示が軽い。 */
let __igScriptLoading = false;
function ensureIGScript(){
  if (window.instgrm && window.instgrm.Embeds) return Promise.resolve();
  if (!__igScriptLoading){
    __igScriptLoading = true;
    const s = document.createElement("script");
    s.async = true; s.src = "https://www.instagram.com/embed.js";
    document.body.appendChild(s);
  }
  return new Promise(res=>{
    const t = setInterval(()=>{ if(window.instgrm && window.instgrm.Embeds){ clearInterval(t); res(); } }, 250);
    setTimeout(()=>{ clearInterval(t); res(); }, 6000);
  });
}
function useInView(ref, rootMargin="240px"){
  const [inView, setInView] = useState(false);
  useEffect(()=>{
    if (inView || !ref.current) return;
    const io = new IntersectionObserver(([e])=>{ if(e.isIntersecting){ setInView(true); io.disconnect(); } }, {rootMargin});
    io.observe(ref.current);
    return ()=>io.disconnect();
  }, [inView]);
  return inView;
}
function IGEmbed({permalink}){
  const wrap = useRef(null);
  const inView = useInView(wrap);
  useEffect(()=>{ if(inView){ ensureIGScript().then(()=>{ if(window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process(); }); } }, [inView]);
  return (
    <div ref={wrap} style={{minHeight: inView?undefined:1}}>
      {inView && (
        <blockquote className="instagram-media"
          data-instgrm-permalink={permalink} data-instgrm-version="14"
          style={{margin:0, width:"100%", minWidth:0, border:"none", boxShadow:"none"}}>
        </blockquote>
      )}
    </div>
  );
}

/* ===== Googleマップの店舗写真（要APIキー・クライアント側・遅延取得） =====
   ▼下の GMAPS_KEY に Google Maps Platform のAPIキーを入れると、全店に「お店の実写」を自動表示します。
   ・Google Cloud で「Places API (New)」＋「Maps JavaScript API」を有効化／請求先を設定（無料枠あり）
   ・キーは必ず［アプリの制限：ウェブサイト(HTTPリファラ)］で  https://hero-sud.github.io/*  に限定すること
   ・各写真にはGoogleの帰属表示（撮影者名）を重ねて表示します
   ・表示が見えたカードだけ取得（遅延）＆セッション内キャッシュで呼び出しを最小化 */
const GMAPS_KEY = ""; // ← ここにAPIキーを貼る（空ならジャンル代表画像のまま動作）
const KITAHIRO_CENTER = { lat: 34.6789, lng: 132.5417 };

let __gmaps = null;
function loadGoogle(){
  if (!GMAPS_KEY) return Promise.reject(new Error("no key"));
  if (__gmaps) return __gmaps;
  // Google公式の動的ライブラリ・ブートストラップローダ
  ((g)=>{var h,a,k,p="maps",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{a=m.createElement("script");e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src="https://maps."+c+"apis.com/maps/api/js?"+e;d[q]=f;a.onerror=()=>h=n(Error("Google Maps could not load."));m.head.append(a);}));d[l]?0:d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n));})({ key: GMAPS_KEY, v: "weekly" });
  __gmaps = google.maps.importLibrary("places");
  return __gmaps;
}

const __photoCache = {};
function useStorePhoto(store){
  const ref = useRef(null);
  const inView = useInView(ref, "300px");
  const [photo, setPhoto] = useState(()=>__photoCache[store.id] || null);
  useEffect(()=>{
    if (!GMAPS_KEY || !inView || photo) return;
    let alive = true;
    (async ()=>{
      try{
        const { Place } = await loadGoogle();
        const { places } = await Place.searchByText({
          textQuery: `${store.name} ${store.place}`,
          fields: ["photos"],
          maxResultCount: 1, language: "ja", region: "jp",
          locationBias: { center: KITAHIRO_CENTER, radius: 25000 },
        });
        const ph = places && places[0] && places[0].photos && places[0].photos[0];
        if (ph && alive){
          const attr = (ph.authorAttributions && ph.authorAttributions[0]) || null;
          const data = { url: ph.getURI({ maxWidth: 900 }), attrName: attr && attr.displayName };
          __photoCache[store.id] = data; setPhoto(data);
        }
      }catch(e){ /* キー未設定/取得失敗時はジャンル代表画像のまま */ }
    })();
    return ()=>{ alive = false; };
  }, [inView, photo]);
  return { ref, photo };
}

const KIND_STYLE = {
  ig:   {bg:"linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)", fg:"#fff", icon:"📷"},
  site: {bg:C.main, fg:"#fff", icon:"🔗"},

  map:  {bg:C.warm, fg:"#fff", icon:"📍"},
};

function mapsUrl(s){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${s.name} ${s.place}`)}`;
}

function Chip({active, onClick, children}){
  return (
    <button type="button" onClick={onClick} aria-pressed={active}
      style={{ cursor:"pointer", border:`1.5px solid ${active?C.main:C.border}`,
        background: active?C.main:C.bgW, color: active?"#fff":C.fg,
        padding:"7px 14px", borderRadius:999, fontSize:14, fontWeight:600,
        transition:"all .15s", whiteSpace:"nowrap" }}>
      {children}
    </button>
  );
}

function LinkBtn({l}){
  const st = KIND_STYLE[l.kind] || KIND_STYLE.site;
  return (
    <a href={l.url} target="_blank" rel="noopener noreferrer"
      style={{ display:"inline-flex", alignItems:"center", gap:6, textDecoration:"none",
        background:st.bg, color:st.fg, border:st.border||"none",
        padding:"8px 12px", borderRadius:10, fontSize:13, fontWeight:700 }}>
      <span aria-hidden="true">{st.icon}</span>{l.label}
    </a>
  );
}

function StoreCard({s}){
  const [showIG, setShowIG] = useState(false);
  const { ref, photo } = useStorePhoto(s);
  const real = photo && photo.url;
  const cover = real || s.officialImg || GENRE_IMG[s.genre] || FALLBACK_IMG;
  return (
    <article style={{ background:C.bgW, borderRadius:18, overflow:"hidden",
      border:`1px solid ${C.border}`, boxShadow:"0 6px 24px rgba(40,40,30,.06)",
      display:"flex", flexDirection:"column" }}>
      <div ref={ref} style={{position:"relative", aspectRatio:"16/10", background:C.bgWarm}}>
        <img src={cover} alt={`${s.name}（${s.genre}）の${real?"写真":"イメージ"}`} loading="lazy" decoding="async"
          onError={e=>{ if(e.target.src!==FALLBACK_IMG){e.target.src=FALLBACK_IMG;} }}
          style={{width:"100%", height:"100%", objectFit:"cover", display:"block"}}/>
        {real && photo.attrName && (
          <span style={{position:"absolute", bottom:32, right:8, fontSize:10, color:"#fff",
            background:"rgba(0,0,0,.5)", padding:"2px 6px", borderRadius:6, maxWidth:"62%",
            overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>📷 {photo.attrName}</span>
        )}
        {s.star && (
          <span style={{position:"absolute", top:12, left:12, background:C.accent, color:"#fff",
            fontSize:12, fontWeight:800, padding:"5px 10px", borderRadius:999,
            boxShadow:"0 2px 8px rgba(0,0,0,.25)"}}>★ 編集部いちおし</span>
        )}
        <span style={{position:"absolute", top:12, right:12, background:"rgba(27,30,22,.78)", color:"#fff",
          fontSize:12, fontWeight:700, padding:"5px 10px", borderRadius:999}}>{s.area}エリア</span>
        <span style={{position:"absolute", bottom:0, left:0, right:0,
          background:"linear-gradient(transparent,rgba(0,0,0,.55))", color:"#fff",
          padding:"24px 14px 10px", fontSize:13, fontWeight:700}}>
          <span style={{background:C.mainL, padding:"2px 8px", borderRadius:6}}>{s.genre}</span>
        </span>
      </div>

      <div style={{padding:"16px 16px 18px", display:"flex", flexDirection:"column", gap:10, flex:1}}>
        <div>
          <h3 style={{margin:"0 0 2px", fontSize:19, color:C.fg, lineHeight:1.25}}>{s.name}</h3>
          <div style={{fontSize:12, color:C.fgXL, letterSpacing:.3}}>{s.reading}</div>
        </div>

        <p style={{margin:0, color:C.mainD, fontWeight:700, fontSize:15, lineHeight:1.5}}>{s.catch}</p>

        <ul style={{margin:"2px 0 0", padding:0, listStyle:"none", display:"flex", flexDirection:"column", gap:6}}>
          {s.points.map((p,i)=>(
            <li key={i} style={{display:"flex", gap:8, fontSize:13.5, color:C.fgL, lineHeight:1.55}}>
              <span aria-hidden="true" style={{color:C.warm, fontWeight:900}}>—</span><span>{p}</span>
            </li>
          ))}
        </ul>

        <dl style={{margin:"4px 0 0", display:"grid", gridTemplateColumns:"auto 1fr", gap:"4px 10px",
          fontSize:13, color:C.fgL, borderTop:`1px dashed ${C.border}`, paddingTop:10}}>
          <dt style={{fontWeight:700, color:C.fg}}>場所</dt><dd style={{margin:0}}>{s.place}</dd>
          <dt style={{fontWeight:700, color:C.fg}}>営業</dt><dd style={{margin:0}}>{s.hours}</dd>
        </dl>

        <div style={{display:"flex", flexWrap:"wrap", gap:8, marginTop:"auto", paddingTop:8}}>
          {s.links.map((l,i)=><LinkBtn key={i} l={l}/>)}
          <a href={mapsUrl(s)} target="_blank" rel="noopener noreferrer"
            style={{display:"inline-flex", alignItems:"center", gap:6, textDecoration:"none",
              background:KIND_STYLE.map.bg, color:KIND_STYLE.map.fg,
              padding:"8px 12px", borderRadius:10, fontSize:13, fontWeight:700}}>
            <span aria-hidden="true">📍</span>地図で開く
          </a>
        </div>

        {s.igPost && (
          <div style={{marginTop:4}}>
            <button type="button" onClick={()=>setShowIG(v=>!v)} aria-expanded={showIG}
              style={{cursor:"pointer", width:"100%", border:`1.5px solid ${C.border}`,
                background:C.bgWarm, color:C.mainD, padding:"9px 12px", borderRadius:10,
                fontSize:13, fontWeight:700}}>
              📷 {showIG ? "公式の写真を閉じる" : "公式の写真を見る（Instagram）"}
            </button>
            {showIG && <div style={{marginTop:10}}><IGEmbed permalink={s.igPost}/></div>}
          </div>
        )}
      </div>
    </article>
  );
}

function App(){
  const [areas, setAreas] = useState(()=>new Set());
  const [genres, setGenres] = useState(()=>new Set());
  const [q, setQ] = useState("");

  // 構造化データ(JSON-LD)をデータから生成して挿入（町外検索の発見性UP）
  useEffect(()=>{
    const data = { "@context":"https://schema.org", "@type":"ItemList",
      name:"広島・北広島町 おすすめランチガイド",
      itemListElement: STORES.map((s,i)=>({ "@type":"ListItem", position:i+1,
        item:{ "@type":"Restaurant", name:s.name, servesCuisine:s.genre,
          address:{ "@type":"PostalAddress", addressLocality:"北広島町", addressRegion:"広島県", addressCountry:"JP" } } })) };
    const el = document.createElement("script");
    el.type = "application/ld+json"; el.text = JSON.stringify(data);
    document.head.appendChild(el);
    return ()=>{ document.head.removeChild(el); };
  }, []);

  const allAreas  = useMemo(()=>AREA_ORDER.filter(a=>STORES.some(s=>s.area===a)), []);
  const allGenres = useMemo(()=>[...new Set(STORES.map(s=>s.genre))], []);

  const toggle = useCallback((setFn, val)=>{
    setFn(prev=>{ const n=new Set(prev); n.has(val)?n.delete(val):n.add(val); return n; });
  }, []);

  const filtered = useMemo(()=>{
    const kw = q.trim().toLowerCase();
    return STORES.filter(s=>{
      if(areas.size && !areas.has(s.area)) return false;
      if(genres.size && !genres.has(s.genre)) return false;
      if(kw){
        const hay = [s.name,s.reading,s.genre,s.area,s.catch,s.place,...s.points].join(" ").toLowerCase();
        if(!hay.includes(kw)) return false;
      }
      return true;
    });
  }, [areas, genres, q]);

  const clearAll = ()=>{ setAreas(new Set()); setGenres(new Set()); setQ(""); };
  const hasFilter = areas.size || genres.size || q.trim();

  return (
    <div style={{background:C.bg, color:C.fg, minHeight:"100vh"}}>

      {/* ===== Hero ===== */}
      <header style={{position:"relative", color:"#fff", overflow:"hidden"}}>
        <img src={img("1517433670267-08bbd4be890f")} alt="" aria-hidden="true"
          onError={e=>{ if(e.target.src!==FALLBACK_IMG){e.target.src=FALLBACK_IMG;} }}
          style={{position:"absolute", inset:0, width:"100%", height:"100%", objectFit:"cover"}}/>
        <div style={{position:"absolute", inset:0, background:"linear-gradient(180deg,rgba(27,30,22,.55),rgba(27,30,22,.82))"}}/>
        <div style={{position:"relative", maxWidth:1100, margin:"0 auto", padding:"72px 20px 64px"}}>
          <div style={{fontSize:14, fontWeight:700, letterSpacing:4, opacity:.9}}>HIROSHIMA · KITAHIROSHIMA</div>
          <h1 style={{fontSize:"clamp(30px,6vw,56px)", margin:"10px 0 14px", lineHeight:1.15, fontWeight:900}}>
            北広島町のランチ、<br/>ぜんぶここに。
          </h1>
          <p style={{fontSize:"clamp(15px,2.2vw,19px)", maxWidth:660, lineHeight:1.7, opacity:.95, margin:"0 0 22px"}}>
            広島市内から車で約1時間。山あいの町に、わざわざ行きたくなる一皿が点在しています。
            廃校のパン屋、土曜だけのベーグル、西日本有数のそば、高原のカフェ——
            <strong>町外の人にこそ知ってほしい</strong>、実在のおすすめランチ・カフェ <strong>{STORES.length}軒</strong>を集めました。
          </p>
          <div style={{display:"flex", gap:18, flexWrap:"wrap", fontSize:14}}>
            <span>✓ 全店じっさいに実在を確認（出典リンク付き）</span>
            <span>🔎 エリア×ジャンルで絞り込み</span>
            <span>📍 各店の地図・公式SNSへすぐ</span>
          </div>
        </div>
      </header>

      {/* ===== 北広島町ってどこ？ ===== */}
      <section style={{maxWidth:1100, margin:"0 auto", padding:"28px 20px 4px"}}>
        <div style={{background:C.bgWarm, border:`1px solid ${C.border}`, borderRadius:16, padding:"18px 20px"}}>
          <h2 style={{margin:"0 0 8px", fontSize:18, color:C.mainD}}>北広島町って、どこ？</h2>
          <p style={{margin:"0 0 12px", fontSize:14.5, color:C.fgL, lineHeight:1.7}}>
            広島県の北西部・山県郡にある町。2005年に旧 <strong>千代田・大朝・豊平・芸北</strong> の4町が合併して生まれました。
            中国自動車道・千代田ICが玄関口。下のエリアタグはこの4地域に対応しています。
          </p>
          <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
            {AREA_ORDER.map(a=>(
              <span key={a} style={{fontSize:12.5, color:C.fgL, background:C.bgW,
                border:`1px solid ${C.border}`, borderRadius:10, padding:"6px 10px"}}>
                <strong style={{color:C.main}}>{a}</strong>：{AREA_NOTE[a]}
              </span>
            ))}
          </div>
        </div>
      </section>

      {/* ===== フィルタ ===== */}
      <section style={{position:"sticky", top:0, zIndex:10, background:`${C.bg}f2`,
        backdropFilter:"blur(6px)", borderBottom:`1px solid ${C.border}`, marginTop:18}}>
        <div style={{maxWidth:1100, margin:"0 auto", padding:"14px 20px"}}>
          <div style={{display:"flex", gap:8, flexWrap:"wrap", alignItems:"center", marginBottom:10}}>
            <input type="search" value={q} onChange={e=>setQ(e.target.value)}
              placeholder="🔎 店名・キーワードで探す（例：そば、古民家、土曜、自家焙煎）"
              aria-label="キーワード検索"
              style={{flex:"1 1 240px", minWidth:0, padding:"10px 14px", fontSize:15,
                border:`1.5px solid ${C.border}`, borderRadius:12, background:C.bgW, color:C.fg}}/>
            <span style={{fontSize:14, fontWeight:800, color:C.mainD, whiteSpace:"nowrap"}}>
              {filtered.length}件 / 全{STORES.length}件
            </span>
            {hasFilter ? (
              <button type="button" onClick={clearAll}
                style={{cursor:"pointer", border:"none", background:"none", color:C.accent,
                  fontSize:13, fontWeight:700, textDecoration:"underline"}}>条件をクリア</button>
            ) : null}
          </div>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center", marginBottom:8}}>
            <span style={{fontSize:12, fontWeight:800, color:C.fgXL, marginRight:2}}>エリア</span>
            {allAreas.map(a=>(<Chip key={a} active={areas.has(a)} onClick={()=>toggle(setAreas,a)}>{a}</Chip>))}
          </div>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"}}>
            <span style={{fontSize:12, fontWeight:800, color:C.fgXL, marginRight:2}}>ジャンル</span>
            {allGenres.map(g=>(<Chip key={g} active={genres.has(g)} onClick={()=>toggle(setGenres,g)}>{g}</Chip>))}
          </div>
        </div>
      </section>

      {/* ===== カードグリッド ===== */}
      <main style={{maxWidth:1100, margin:"0 auto", padding:"24px 20px 8px"}}>
        {filtered.length ? (
          <div style={{display:"grid", gap:20, gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))"}}>
            {filtered.map(s=><StoreCard key={s.id} s={s}/>)}
          </div>
        ) : (
          <div style={{textAlign:"center", padding:"60px 20px", color:C.fgL}}>
            <div style={{fontSize:40}}>🍙</div>
            <p style={{fontSize:16, fontWeight:700, margin:"10px 0 4px"}}>条件に合うお店が見つかりませんでした</p>
            <button type="button" onClick={clearAll}
              style={{cursor:"pointer", border:`1.5px solid ${C.main}`, background:C.bgW,
                color:C.main, padding:"8px 16px", borderRadius:10, fontWeight:700, fontSize:14}}>
              条件をクリアして全部見る
            </button>
          </div>
        )}
      </main>

      {/* ===== フッター（情報の正確性ノート＋出典） ===== */}
      <footer style={{background:C.bgDark, color:"#D8D3C8", marginTop:32}}>
        <div style={{maxWidth:1100, margin:"0 auto", padding:"36px 20px 40px"}}>
          <h2 style={{color:"#fff", fontSize:18, margin:"0 0 10px"}}>このページについて / 情報の正確性</h2>
          <p style={{fontSize:13.5, lineHeight:1.8, margin:"0 0 14px", maxWidth:780}}>
            本ページは北広島町のランチを町外の方へ紹介するために作成した
            <strong style={{color:"#fff"}}>ファンメイドのまとめ</strong>です。
            掲載情報は <strong style={{color:"#fff"}}>2026年6月時点</strong> の公開情報（北広島町観光協会・食べログ・各店公式 等）に基づく調査で、
            掲載店はいずれも実在を確認しています。ただし
            <strong style={{color:"#fff"}}>営業日・営業時間・定休日・メニュー・価格は変動し、冬期休業の店も多く</strong>あります。
            おでかけ前に、必ず各カードの公式リンク（Instagram・公式サイト等）で最新情報をご確認ください。
            掲載の希望・修正の依頼があれば、各店および制作者までお知らせください。
          </p>
          <div style={{display:"flex", flexWrap:"wrap", gap:"6px 16px", fontSize:13, marginBottom:18}}>
            <span style={{color:"#9B978E", fontWeight:700}}>主な出典：</span>
            {SOURCES.map((s,i)=>(
              <a key={i} href={s.url} target="_blank" rel="noopener noreferrer"
                style={{color:C.warmL, textDecoration:"none"}}>{s.label} ↗</a>
            ))}
          </div>
          <div style={{borderTop:"1px solid #3A3D34", paddingTop:14, fontSize:12, color:"#9B978E"}}>
            🍙 北広島町おすすめランチガイド ／ {GMAPS_KEY
              ? "※店舗写真は Google マップの公開写真を表示しています（各写真の撮影者の帰属を画像内に表示）。最新の様子は各店の公式リンク先もご覧ください。"
              : "※カバー画像はジャンルのイメージ画像です。各店の実際の写真は公式リンク先（Instagram・公式サイト）でご覧ください。"}
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
