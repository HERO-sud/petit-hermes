function useVis(th = 0.08) {
  const r = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const el = r.current; if (!el) return;
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); o.disconnect(); } }, { threshold: th });
    o.observe(el); return () => o.disconnect();
  }, []);
  return [r, v];
}

function R({ children, d = 0, y = 32, s = {} }) {
  const [r, v] = useVis();
  return (<div ref={r} style={{ opacity: v ? 1 : 0, transform: v ? "none" : `translateY(${y}px)`, transition: `opacity 0.9s cubic-bezier(.16,1,.3,1) ${d}s, transform 0.9s cubic-bezier(.16,1,.3,1) ${d}s`, willChange: "opacity, transform", ...s }}>{children}</div>);
}

function Img({ src, alt = "", r = "4/3", rd = 10, hov = false, s = {} }) {

          transform: hov && h ? "scale(1.05)" : "scale(1)" }} />
    </div>
  );
}

function Marquee({ items, speed = 40 }) {
  const t = items.join("   ·   ") + "   ·   ";
  return (
    <div style={{ overflow: "hidden", whiteSpace: "nowrap", background: C.main, color: "rgba(255,255,255,0.7)", padding: "11px 0", fontSize: 12, letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 500 }}>
      <div style={{ display: "inline-block", animation: `marquee ${speed}s linear infinite` }}>{t}{t}</div>
      <style>{`@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}`}</style>
    </div>
  );
}

function Counter({ n, suffix = "", pre = "" }) {
  const [r, v] = useVis();
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!v) return;
    const dur = 1800; const st = performance.now();
    const tick = (now) => {
      const p = Math.min((now - st) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 4);
      setVal(Math.round(ease * n));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [v, n]);
  return (<span ref={r} style={{ fontFamily: "'Playfair Display',serif", fontSize: "clamp(2.2rem,6vw,3.6rem)", fontWeight: 700, color: C.mainD, lineHeight: 1 }}>{pre}{val.toLocaleString()}{suffix}</span>);
}

function Btn({ children, primary = true, lg = false, onClick, href, s = {} }) {
  const [h, setH] = useState(false);
  const baseStyle = {
    display: "inline-flex", alignItems: "center", gap: 8,
    padding: lg ? "17px 42px" : "13px 30px",
    borderRadius: 50, fontSize: lg ? 15 : 14, fontWeight: 600, cursor: "pointer",
    fontFamily: "'Zen Kaku Gothic New',sans-serif", letterSpacing: "0.03em",
    border: primary ? "none" : `1.5px solid ${C.main}`,
    background: primary ? (h ? C.mainD : C.main) : (h ? C.main : "transparent"),
    color: primary ? "#fff" : (h ? "#fff" : C.main),
    transition: "all 0.35s cubic-bezier(.16,1,.3,1)",
    boxShadow: h ? "0 8px 28px rgba(58,74,47,0.2)" : "none",
    textDecoration: "none", ...s,
  };
  if (href) {
    return (<a href={href} target="_blank" rel="noopener noreferrer" onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={baseStyle}>{children}</a>);
  }
  return (<button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={baseStyle}>{children}</button>);
}

function ScrollToTop() {
  const [show, setShow] = useState(false);
  const [hover, setHover] = useState(false);
  useEffect(() => {
    const h = () => setShow(window.scrollY > 400);
    window.addEventListener("scroll", h, { passive: true });
    return () => window.removeEventListener("scroll", h);
  }, []);
  if (!show) return null;
  return (
    <button onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        position: "fixed", bottom: 24, right: 24, zIndex: 80,
        width: 48, height: 48, borderRadius: "50%",
        background: hover ? C.mainD : C.main, color: "#fff",
        border: "none", cursor: "pointer", fontSize: 20,
        boxShadow: "0 4px 16px rgba(0,0,0,0.2)",
        display: "flex", alignItems: "center", justifyContent: "center",
        transition: "all 0.3s cubic-bezier(.16,1,.3,1)",
        opacity: show ? 1 : 0, transform: show ? "scale(1)" : "scale(0.5)",
      }}>↑</button>

}
